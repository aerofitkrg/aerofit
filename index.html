<body>

<div class="container">

  <h1>🔥 Акция Aerofit Club Vostok</h1>

  <div class="subtitle">
    Цена повышается каждую минуту
  </div>

  <div class="price" id="price">
    138 000 ₸
  </div>

  <div class="timer" id="timer">
    Загрузка...
  </div>

  <div class="status" id="status"></div>

</div>

<script>

  // Казахстан UTC+5
  const startTime = new Date("2026-05-27T14:00:00+05:00");
  const endTime   = new Date("2026-05-27T15:00:00+05:00");

  const startPrice = 138000;
  const endPrice = 198000;

  const totalMinutes = 60;
  const increasePerMinute = (endPrice - startPrice) / totalMinutes;

  function updateSite(){

    const now = new Date();

    const timer = document.getElementById("timer");
    const price = document.getElementById("price");
    const status = document.getElementById("status");

    // ДО СТАРТА
    if(now < startTime){

      const diff = startTime - now;

      const hours = Math.floor(diff / 1000 / 60 / 60);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      timer.innerHTML =
        `Старт через: ${hours}ч ${minutes}м ${seconds}с`;

      price.innerHTML =
        startPrice.toLocaleString('ru-RU') + " ₸";

      status.innerHTML =
        "Акция ещё не началась";

      return;
    }

    // ПОСЛЕ ЗАВЕРШЕНИЯ
    if(now >= endTime){

      timer.innerHTML = "Акция завершена";

      price.innerHTML =
        endPrice.toLocaleString('ru-RU') + " ₸";

      status.innerHTML =
        "Финальная цена";

      return;
    }

    // ВО ВРЕМЯ АКЦИИ
    const passedMinutes =
      Math.floor((now - startTime) / 1000 / 60);

    const currentPrice =
      Math.round(startPrice + (passedMinutes * increasePerMinute));

    const remaining =
      endTime - now;

    const mins =
      Math.floor(remaining / 1000 / 60);

    const secs =
      Math.floor((remaining / 1000) % 60);

    price.innerHTML =
      currentPrice.toLocaleString('ru-RU') + " ₸";

    timer.innerHTML =
      `До конца акции: ${mins}м ${secs}с`;

    status.innerHTML =
      `Цена выросла на ${(currentPrice - startPrice).toLocaleString('ru-RU')} ₸`;

  }

  updateSite();

  setInterval(updateSite,1000);

</script>

<body>

  <h1>🔥 Акция действует 1 час</h1>

  <div class="price" id="price">190 000 ₸</div>
  <div class="timer" id="timer"></div>

<script>
  // Время акции (Астана = Asia/Almaty)
  const startTime = new Date("2026-05-26T13:00:00+06:00");
  const endTime   = new Date("2026-05-26T14:00:00+06:00");

  const startPrice = 190000;
  const endPrice = 250000;

  function update() {
    const now = new Date();

    if (now < startTime) {
      document.getElementById("timer").innerText = "Акция ещё не началась";
      document.getElementById("price").innerText = startPrice.toLocaleString() + " ₸";
      return;
    }

    if (now > endTime) {
      document.getElementById("timer").innerText = "Акция завершена";
      document.getElementById("price").innerText = endPrice.toLocaleString() + " ₸";
      return;
    }

    const totalMinutes = 60;
    const minutesPassed = Math.floor((now - startTime) / 60000);

    const price = startPrice + (minutesPassed * 1000); // +1000 ₸ в минуту

    const timeLeft = endTime - now;
    const min = Math.floor(timeLeft / 60000);
    const sec = Math.floor((timeLeft % 60000) / 1000);

    document.getElementById("price").innerText = price.toLocaleString() + " ₸";
    document.getElementById("timer").innerText =
      `До конца: ${min} мин ${sec} сек`;
  }

  update();
  setInterval(update, 1000);
</script>

</body>
